<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GraficaEspacio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="cmyk" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

    <header class="hero">
        <div class="container">
            <h1>Bienvenido a <span class="marca">GraficaEspacio</span></h1>
            <button id="iniciarCompraBtn" class="btn btn-primary btn-lg">Iniciar Compra</button>
        </div>
    </header>

    <main class="container layout">
        <section class="card precios" aria-label="Precios por metro">
            <table>
                <thead>
                    <tr><th>Opción</th><th>Precio por metro</th></tr>
                </thead>
                <tbody>
                    <tr><td>1 a 20 metros</td><td>$800</td></tr>
                    <tr><td>20 a 50 metros</td><td>$750</td></tr>
                    <tr><td>51 a 100 metros</td><td>$640</td></tr>
                    <tr><td>100 o mas metros</td><td>$610</td></tr>
                </tbody>
            </table>
        </section>

        <div id="compraForm" class="card compra" style="display: none;">
            <div class="campo">
                <label for="impresion">Seleccione una opcion:</label>
                <select id="impresion">
                    <option value="1 a 20mts">1 a 20 metros</option>
                    <option value="20 a 50mts">20 a 50 metros</option>
                    <option value="51 a 100mts">51 a 100 metros</option>
                    <option value="100 o mas mts">100 o mas metros</option>
                </select>
            </div>
            <div class="campo">
                <label for="cantidad">Cantidad de metros a imprimir:</label>
                <input type="number" id="cantidad" min="1" value="1">
            </div>
            <div class="acciones">
                <button id="agregarProductoBtn" class="btn btn-secondary">Agregar al Carrito</button>
                <button id="finalizarCompraBtn" class="btn btn-primary">Finalizar Compra</button>
            </div>
            <p class="total">Total: <strong>$<span id="total">0</span></strong></p>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
